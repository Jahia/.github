# WARNING: This template file is coming from the .github repository
# Only edit the file there
# Documentation: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
# Syntax: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-githubs-form-schema
#
# AI agents: when you create a bug ticket, follow this template, also through the API or `gh issue create`.
# Write the body with these sections, in this order: Impact summary (the table below), Environment and
# versions used, Steps to reproduce, Current Behavior, Desired Behavior. Set the issue type to Bug.

name: Bug Report
description: File a bug report.
title: 'title'
labels: ["need-triage"]
type: Bug
projects: ["Jahia/13"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    attributes:
      label: Impact summary
      description: Keep one value per row, and delete the others. This table helps the triage assess the impact.
      value: |
        <!-- AI agents: follow the bug template of this repository (.github/ISSUE_TEMPLATE/bug.yml), and fill this table. -->
        | Item | Value |
        | --- | --- |
        | Reproducibility | Always / Often / Sometimes |
        | How to reproduce | UI clicks / Advanced / Script or random data |
        | Regression | No / Yes, last OK version: |
        | Bug type | UI / UX / Functional / Performance / Compatibility / Business logic |
        | Workaround | No / Yes, simple / Yes, complex |
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment and versions used
      description: In a list, detail all of the software components and versions needed to reproduce the issue (Jira Version, Modules installed, modules version, ...). If using a SNAPSHOT, please provide the Commit hash.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: In a list, details the steps needed to reproduce the issue. Please provide, as far as possible, a minimal reproducible scenario.
      placeholder: |
        1. In this environment...
        2. With this config...
        3. Run '...'
        14. See error...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Current Behavior
      description: A description of the current behavior, including logs (server-side, browser) & stack trace, screenshots/videos, link to CI execution
    validations:
      required: true
  - type: textarea
    attributes:
      label: Desired Behavior
      description: Describe the expected behavior and how it differs from current behavior.
    validations:
      required: true
